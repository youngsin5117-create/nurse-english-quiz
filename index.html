<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>순환기내과 영어회화 퀴즈</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f0f4f8; min-height: 100vh; padding: 16px; }
h1 { color: #1B3A6B; font-size: 18px; margin-bottom: 4px; }
.sub { color: #666; font-size: 13px; margin-bottom: 20px; }
.stats { display: flex; gap: 10px; margin-bottom: 16px; }
.stat { flex: 1; background: #fff; border-radius: 8px; padding: 12px; text-align: center; border: 1px solid #dde4ea; }
.stat-label { font-size: 11px; color: #888; text-transform: uppercase; }
.stat-num { font-size: 22px; font-weight: bold; color: #1B3A6B; }
.stat-num.green { color: #1D9E75; }
.stat-num.red   { color: #E8523A; }
.prog-wrap { background: #dde4ea; border-radius: 99px; height: 6px; margin-bottom: 16px; }
.prog-fill { background: #2E7D8C; height: 6px; border-radius: 99px; transition: width .4s; }
.badge { display: inline-block; background: #EAF4F6; color: #2E7D8C; border-radius: 6px; padding: 3px 10px; font-size: 12px; font-weight: bold; margin-bottom: 12px; }
.q-card { background: #fff; border-left: 4px solid #1B3A6B; border-radius: 8px; padding: 18px 20px; margin-bottom: 14px; }
.q-hint { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 8px; }
.q-text { font-size: 19px; font-weight: bold; color: #1B3A6B; line-height: 1.5; }
.answer-zone { min-height: 54px; border: 2px dashed #aab; border-radius: 8px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; background: #fff; }
.answer-zone.correct { border-color: #1D9E75; background: #e8f8f2; }
.answer-zone.wrong   { border-color: #E8523A; background: #fef0ed; }
.az-hint { color: #bbb; font-size: 13px; }
.word-bank { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.wchip { padding: 8px 14px; background: #fff; border: 1.5px solid #ccc; border-radius: 8px; font-size: 14px; cursor: pointer; user-select: none; }
.wchip:hover { background: #EAF4F6; border-color: #2E7D8C; color: #2E7D8C; }
.wchip.used { opacity: .2; pointer-events: none; }
.achip { padding: 8px 14px; background: #1B3A6B; color: #fff; border-radius: 8px; font-size: 14px; cursor: pointer; user-select: none; }
.achip:hover { background: #E8523A; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
button { padding: 10px 20px; border-radius: 8px; border: 1.5px solid #ccc; background: #fff; font-size: 14px; cursor: pointer; font-family: Arial, sans-serif; }
button:hover { background: #f0f4f8; }
.btn-check { background: #1B3A6B; color: #fff; border-color: #1B3A6B; }
.btn-check:hover { background: #142D52; }
.btn-next  { background: #1D9E75; color: #fff; border-color: #1D9E75; }
.btn-next:hover { background: #178a63; }
.feedback { border-radius: 8px; padding: 12px 16px; font-size: 14px; font-weight: bold; margin-bottom: 4px; display: none; }
.feedback.ok { display: block; background: #e8f8f2; color: #0e6b4e; border-left: 4px solid #1D9E75; }
.feedback.ng { display: block; background: #fef0ed; color: #9b3a25; border-left: 4px solid #E8523A; }
.answer-txt { font-size: 13px; color: #1B3A6B; margin-top: 5px; font-family: 'Courier New', monospace; }
.start-card { background: #fff; border-radius: 12px; padding: 28px; border: 1px solid #dde4ea; }
.start-card h2 { color: #1B3A6B; font-size: 18px; margin-bottom: 8px; }
.start-card p  { color: #666; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
.filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.fchip { padding: 7px 13px; border-radius: 8px; border: 1.5px solid #ccc; font-size: 12px; font-weight: bold; cursor: pointer; background: #fff; color: #666; }
.fchip.on { background: #1B3A6B; color: #fff; border-color: #1B3A6B; }
.fchip:hover { border-color: #2E7D8C; }
.count-note { font-size: 13px; color: #666; margin-bottom: 18px; }
.btn-start { width: 100%; padding: 14px; font-size: 15px; background: #1B3A6B; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-family: Arial, sans-serif; }
.btn-start:hover { background: #142D52; }
.finish-card { background: #fff; border-radius: 12px; padding: 36px 24px; text-align: center; border: 1px solid #dde4ea; }
.finish-icon { font-size: 48px; margin-bottom: 10px; }
.finish-card h2 { font-size: 22px; color: #1B3A6B; margin-bottom: 6px; }
.final-score { font-size: 52px; font-weight: bold; color: #1D9E75; margin: 10px 0; }
.finish-msg { font-size: 14px; color: #666; margin: 12px auto 24px; max-width: 320px; line-height: 1.6; }
.res-row { display: flex; gap: 10px; margin-bottom: 24px; }
.res-cell { flex: 1; background: #f0f4f8; border-radius: 8px; padding: 14px; text-align: center; }
.res-cell .rl { font-size: 11px; color: #888; text-transform: uppercase; }
.res-cell .rv { font-size: 20px; font-weight: bold; }
.rv.green { color: #1D9E75; }
.rv.red   { color: #E8523A; }
.finish-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
#quiz   { display: none; }
#finish { display: none; }
</style>
</head>
<body>

<h1>&#9829; 순환기내과 영어회화 퀴즈</h1>
<p class="sub">Cardiology Nursing English Quiz &mdash; 25병동</p>

<div id="start">
  <div class="start-card">
    <h2>챕터 선택</h2>
    <p>연습할 챕터를 선택하세요.<br>랜덤 10문제씩 출제됩니다.</p>
    <div class="filter-row" id="filter-row"></div>
    <div class="count-note" id="count-note"></div>
    <button class="btn-start" onclick="startQuiz()">시작하기 &rarr;</button>
  </div>
</div>

<div id="quiz">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
    <span style="font-size:13px;color:#666;">문제 <strong id="qnum" style="color:#1B3A6B;">1</strong> / <span id="qtotal">10</span></span>
    <span id="streak" style="display:none;font-size:12px;font-weight:bold;color:#C9952A;background:#FEF3DF;padding:3px 10px;border-radius:6px;"></span>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-label">점수</div><div class="stat-num green" id="s-score">0</div></div>
    <div class="stat"><div class="stat-label">정답</div><div class="stat-num green" id="s-ok">0</div></div>
    <div class="stat"><div class="stat-label">오답</div><div class="stat-num red" id="s-ng">0</div></div>
  </div>
  <div class="prog-wrap"><div class="prog-fill" id="prog" style="width:0%"></div></div>
  <div class="badge" id="badge">Ch01</div>
  <div class="q-card">
    <div class="q-hint">다음 문장을 영어로 완성하세요</div>
    <div class="q-text" id="qtext"></div>
  </div>
  <div class="answer-zone" id="az"><span class="az-hint">아래 단어를 순서대로 클릭하세요</span></div>
  <div class="word-bank" id="wb"></div>
  <div class="btn-row">
    <button class="btn-check" id="btn-check" onclick="checkAns()">확인하기 &#10003;</button>
    <button class="btn-next" id="btn-next" onclick="nextQ()" style="display:none">다음 문제 &rarr;</button>
    <button onclick="resetAns()">&#8635; 다시</button>
    <button onclick="goStart()" style="font-size:12px;color:#888;margin-left:auto;">챕터 변경</button>
  </div>
  <div class="feedback" id="fb"></div>
</div>

<div id="finish">
  <div class="finish-card">
    <div class="finish-icon" id="f-icon"></div>
    <h2>퀴즈 완료!</h2>
    <div class="final-score" id="f-score"></div>
    <div class="res-row">
      <div class="res-cell"><div class="rl">정답</div><div class="rv green" id="f-ok"></div></div>
      <div class="res-cell"><div class="rl">오답</div><div class="rv red" id="f-ng"></div></div>
    </div>
    <div class="finish-msg" id="f-msg"></div>
    <div class="finish-btns">
      <button class="btn-check" style="padding:12px 24px;" onclick="startQuiz()">같은 챕터로 다시</button>
      <button style="padding:12px 24px;" onclick="goStart()">챕터 선택</button>
    </div>
  </div>
</div>

<script>
var QS=[
  {ch:"Ch01 입원",ko:"안녕하세요, 25병동에 오신 것을 환영합니다.",en:"Hello welcome to Ward 25"},
  {ch:"Ch01 입원",ko:"저는 오늘 담당 간호사입니다.",en:"I will be your nurse today"},
  {ch:"Ch01 입원",ko:"성함과 생년월일을 확인해도 될까요?",en:"May I confirm your name and date of birth please"},
  {ch:"Ch01 입원",ko:"지금 병실로 안내해 드리겠습니다.",en:"I will take you to your room now"},
  {ch:"Ch01 입원",ko:"콜벨은 여기 있습니다. 도움이 필요하시면 언제든지 눌러주세요.",en:"The call bell is right here please press it anytime you need help"},
  {ch:"Ch01 입원",ko:"면회 시간은 오후 1시부터 8시까지입니다.",en:"Visiting hours are from 1 PM to 8 PM"},
  {ch:"Ch01 입원",ko:"약물이나 음식 알레르기가 있으신가요?",en:"Do you have any allergies to medications or food"},
  {ch:"Ch01 입원",ko:"입원 중 복용 중인 약이 있으면 알려주세요.",en:"Please let me know if you are taking any medications at home"},
  {ch:"Ch01 입원",ko:"식사는 하루 세 번 제공됩니다.",en:"Meals are served three times a day"},
  {ch:"Ch01 입원",ko:"화장실은 복도 오른쪽에 있습니다.",en:"The bathroom is on the right side of the hallway"},
  {ch:"Ch02 활력징후",ko:"활력징후를 측정하겠습니다. 괜찮으세요?",en:"I need to check your vital signs is that okay"},
  {ch:"Ch02 활력징후",ko:"먼저 혈압을 측정하겠습니다.",en:"I will check your blood pressure first"},
  {ch:"Ch02 활력징후",ko:"왼쪽 팔을 뻗고 편하게 계세요.",en:"Please extend your left arm and relax"},
  {ch:"Ch02 활력징후",ko:"맥박을 측정하겠습니다. 잠시 움직이지 마세요.",en:"Let me count your pulse please keep still for a moment"},
  {ch:"Ch02 활력징후",ko:"체온을 재겠습니다. 입을 벌려주세요.",en:"I will take your temperature please open your mouth"},
  {ch:"Ch02 활력징후",ko:"산소포화도를 측정하겠습니다. 손가락에 끼워드릴게요.",en:"I will measure your oxygen saturation I will clip this onto your finger"},
  {ch:"Ch02 활력징후",ko:"혈압이 138에 88입니다. 차트에 기록하겠습니다.",en:"Your blood pressure is 138 over 88 I will note that in your chart"},
  {ch:"Ch02 활력징후",ko:"체온이 38.2도입니다. 의사에게 보고하겠습니다.",en:"Your temperature is 38.2 degrees I will report this to the doctor"},
  {ch:"Ch02 라운딩",ko:"안녕하세요, 라운딩 중입니다. 오늘 기분은 어떠세요?",en:"Hi I am doing my rounds how are you feeling today"},
  {ch:"Ch02 라운딩",ko:"0에서 10점 중 불편함을 몇 점으로 표현하시겠어요?",en:"On a scale of 0 to 10 how would you rate the discomfort"},
  {ch:"Ch02 라운딩",ko:"말씀해 주셔서 감사합니다. 바로 의사에게 보고하겠습니다.",en:"Thank you for telling me I will inform the doctor right away"},
  {ch:"Ch02 라운딩",ko:"잘 주무셨나요?",en:"Did you sleep well"},
  {ch:"Ch02 라운딩",ko:"오늘 식사는 잘 하셨나요?",en:"Were you able to eat your meals today"},
  {ch:"Ch03 통증",ko:"지금 통증이 있으신가요?",en:"Are you in any pain right now"},
  {ch:"Ch03 통증",ko:"언제 시작됐나요? 갑자기 시작됐나요, 서서히 생겼나요?",en:"When did it start was it sudden or gradual"},
  {ch:"Ch03 통증",ko:"나아지거나 악화되는 요소가 있나요?",en:"Does anything make it better or worse"},
  {ch:"Ch03 통증",ko:"통증이 팔, 턱, 등으로 퍼지나요?",en:"Does the pain spread to your arm jaw or back"},
  {ch:"Ch03 통증",ko:"통증이 둔한가요, 날카롭나요, 화끈거리나요?",en:"Is the pain dull sharp or burning"},
  {ch:"Ch03 통증",ko:"진통제를 투여하겠습니다. 조금만 기다려 주세요.",en:"I will give you a pain reliever please wait a moment"},
  {ch:"Ch03 통증",ko:"심전도 모니터를 연결하고 즉시 의사를 호출하겠습니다.",en:"I will connect you to the cardiac monitor and call the doctor immediately"},
  {ch:"Ch03 통증",ko:"진정하시고 천천히 호흡해 주세요. 제가 여기 있겠습니다.",en:"Please try to stay calm and breathe slowly I am right here with you"},
  {ch:"Ch04 심장증상",ko:"심장이 평소보다 빠르게 뛰거나 불규칙하게 뛰는 것을 느끼셨나요?",en:"Have you noticed your heart beating faster than usual or irregularly"},
  {ch:"Ch04 심장증상",ko:"심장이 두근거리거나 퍼덕이는 느낌이 드시나요?",en:"Do you feel your heart pounding or fluttering"},
  {ch:"Ch04 심장증상",ko:"한 번 그럴 때 보통 얼마나 지속되나요?",en:"How long does an episode usually last"},
  {ch:"Ch04 심장증상",ko:"쉬고 있을 때도 생기나요, 아니면 활동할 때만 생기나요?",en:"Does it happen when you are resting or only during activity"},
  {ch:"Ch04 심장증상",ko:"호흡에 어려움이 있으신가요?",en:"Are you having any trouble breathing"},
  {ch:"Ch04 심장증상",ko:"누웠을 때 숨이 차나요?",en:"Do you feel breathless when lying flat"},
  {ch:"Ch04 심장증상",ko:"침대 머리를 올려드리고 산소를 공급하겠습니다.",en:"I will raise the head of your bed and give you some oxygen"},
  {ch:"Ch04 심장증상",ko:"다리, 발목, 발에 부기가 있으신가요?",en:"Have you noticed any swelling in your legs ankles or feet"},
  {ch:"Ch04 심장증상",ko:"최근에 어지럼증이나 실신을 경험하셨나요?",en:"Have you felt dizzy or fainted recently"},
  {ch:"Ch04 심장증상",ko:"최근에 체중이 갑자기 늘었나요?",en:"Have you gained weight suddenly recently"},
  {ch:"Ch05 검사",ko:"오늘 검사가 처방되었습니다. 설명드리겠습니다.",en:"The doctor has ordered some tests for you today I would like to explain them"},
  {ch:"Ch05 검사",ko:"혈액 검사를 위해 채혈이 필요합니다.",en:"We need to draw some blood for lab work"},
  {ch:"Ch05 검사",ko:"오늘 아침에 드신 것이 있나요?",en:"Have you eaten anything this morning"},
  {ch:"Ch05 검사",ko:"검사 전 금속 액세서리는 모두 빼주시기 바랍니다.",en:"Please take off any metal jewelry or accessories before the test"},
  {ch:"Ch05 검사",ko:"전혀 아프지 않으며 약 5분이면 됩니다.",en:"It is completely painless and only takes about 5 minutes"},
  {ch:"Ch05 검사",ko:"가슴, 팔, 다리에 전극 패드를 붙이겠습니다.",en:"I will place some sticky patches on your chest arms and legs"},
  {ch:"Ch05 검사",ko:"가만히 누워서 평소처럼 숨을 쉬세요. 기록하는 동안 말씀하지 마세요.",en:"Please lie still and breathe normally do not talk during the recording"},
  {ch:"Ch05 검사",ko:"이것은 심장의 전기적 활동을 기록하는 검사입니다.",en:"This records the electrical activity of your heart"},
  {ch:"Ch05 검사",ko:"비침습적이며 완전히 안전한 검사입니다.",en:"It is non-invasive and completely safe"},
  {ch:"Ch06 금식",ko:"오늘 자정부터 금식이 필요합니다.",en:"You will need to fast from midnight tonight"},
  {ch:"Ch06 금식",ko:"자정 이후에는 음식도 물도 드시면 안 됩니다.",en:"No food or water after 12 AM"},
  {ch:"Ch06 금식",ko:"물, 사탕, 껌을 포함하여 아무것도 드시거나 마시면 안 됩니다.",en:"Please do not eat or drink anything including water candy or chewing gum"},
  {ch:"Ch06 금식",ko:"내일 아침 시술이 예정되어 있어 위장이 비어 있어야 합니다.",en:"You are scheduled for a procedure tomorrow morning that requires an empty stomach"},
  {ch:"Ch06 금식",ko:"일부 약은 소량의 물과 함께 복용 가능합니다.",en:"Some medications may be allowed with a tiny sip of water"},
  {ch:"Ch06 금식",ko:"하루 1.5리터로 수분 섭취를 제한해 주세요.",en:"Please limit fluids to 1.5 liters per day to prevent fluid overload"},
  {ch:"Ch07 투약",ko:"약 드실 시간입니다. 각 약의 용도를 설명드리겠습니다.",en:"It is time for your medications I will explain what each one is for"},
  {ch:"Ch07 투약",ko:"이 흰 알약은 아스피린입니다. 혈전 예방에 도움을 줍니다.",en:"This white tablet is aspirin it helps prevent blood clots"},
  {ch:"Ch07 투약",ko:"이것은 베타차단제입니다. 심박수를 낮추고 혈압을 내립니다.",en:"This is a beta-blocker it slows your heart rate and lowers blood pressure"},
  {ch:"Ch07 투약",ko:"이것은 이뇨제입니다. 체내 과잉 수분을 제거하는 데 도움을 줍니다.",en:"This is a diuretic it helps remove excess fluid from your body"},
  {ch:"Ch07 투약",ko:"이 약을 복용한 후 특이한 증상이 있으셨나요?",en:"Have you had any unusual symptoms since starting these medications"},
  {ch:"Ch07 주사",ko:"정맥주사를 삽입하겠습니다. 혈관에 작은 바늘을 넣겠습니다.",en:"I need to start an IV line I will insert a small needle into your vein"},
  {ch:"Ch07 주사",ko:"약간 따끔할 수 있습니다. 움직이지 마세요.",en:"You may feel a small pinch please hold still"},
  {ch:"Ch07 주사",ko:"주사 부위에 화끈거림, 부종, 통증이 있으면 알려주세요.",en:"Please let me know if you feel any burning swelling or pain around the IV site"},
  {ch:"Ch08 배뇨배변",ko:"오늘 소변을 보셨나요? 몇 번이나 보셨나요?",en:"Have you been able to urinate today how many times"},
  {ch:"Ch08 배뇨배변",ko:"소변 색깔이나 양에 변화가 있으셨나요?",en:"Did you notice any change in the color or amount of urine"},
  {ch:"Ch08 배뇨배변",ko:"소변을 볼 때 통증이나 화끈거림이 있으신가요?",en:"Do you feel any pain or burning when you urinate"},
  {ch:"Ch08 배뇨배변",ko:"지금부터 소변량을 측정하겠습니다.",en:"I will measure your urine output from now on"},
  {ch:"Ch08 배뇨배변",ko:"오늘 대변을 보셨나요?",en:"Have you had a bowel movement today"},
  {ch:"Ch08 배뇨배변",ko:"마지막으로 대변을 보신 게 언제였나요?",en:"When was your last bowel movement"},
  {ch:"Ch08 배뇨배변",ko:"복부 팽만감이나 불편함이 있으신가요?",en:"Do you feel any abdominal bloating or discomfort"},
  {ch:"Ch08 배뇨배변",ko:"의사에게 보고하고 변비약 처방을 검토하겠습니다.",en:"I will report this to the doctor and we may order a mild laxative for you"},
  {ch:"Ch09 시술후",ko:"시술 후 관리에 대해 설명드리겠습니다.",en:"I will explain the post-procedure care"},
  {ch:"Ch09 시술후",ko:"다리를 펴고 4시간 동안 구부리지 마세요.",en:"Please keep your leg straight and do not bend it for the next 4 hours"},
  {ch:"Ch09 시술후",ko:"천자 부위에서 출혈 위험이 있습니다. 자주 확인하겠습니다.",en:"There is a risk of bleeding at the puncture site I will check it frequently"},
  {ch:"Ch09 시술후",ko:"사타구니에 출혈, 부종, 열감이 생기면 강하게 눌러주시고 즉시 불러주세요.",en:"If you notice any bleeding swelling or warmth at the groin press firmly and call me immediately"},
  {ch:"Ch09 시술후",ko:"조영제를 배출하기 위해 물을 충분히 드세요.",en:"Please drink plenty of fluids to flush the contrast dye out of your kidneys"},
  {ch:"Ch09 시술후",ko:"항응고제를 복용 중이므로 넘어지지 않도록 각별히 주의해 주세요.",en:"Because you are on blood thinners please be very careful not to fall"},
  {ch:"Ch09 시술후",ko:"밤 동안 지속적으로 심장 리듬을 모니터하겠습니다.",en:"I will be checking your heart rhythm on the monitor throughout the night"},
  {ch:"Ch10 퇴원",ko:"오늘 퇴원하시게 되었습니다. 퇴원 교육을 진행하겠습니다.",en:"You are being discharged today let me go through your discharge instructions"},
  {ch:"Ch10 퇴원",ko:"처방된 모든 약을 계속 복용해 주세요.",en:"Please continue taking all your medications as prescribed"},
  {ch:"Ch10 퇴원",ko:"의사와 상담 없이 약을 임의로 중단하지 마세요.",en:"Do not stop any medication without consulting your doctor"},
  {ch:"Ch10 퇴원",ko:"집에서 매일 혈압과 맥박을 측정하세요.",en:"Monitor your blood pressure and heart rate at home daily"},
  {ch:"Ch10 퇴원",ko:"기록을 유지하고 다음 진료 시 가져오세요.",en:"Keep a log and bring it to your next appointment"},
  {ch:"Ch10 퇴원",ko:"2주 후 외래 예약이 되어 있습니다.",en:"Your follow-up appointment is scheduled for two weeks from today"},
  {ch:"Ch10 퇴원",ko:"퇴원 전에 필요한 서류가 있으신가요?",en:"Do you need any documents before you leave"},
  {ch:"Ch10 퇴원",ko:"진단서는 1층 의무기록실에서 신청하실 수 있습니다.",en:"A medical certificate can be requested at the medical records office on the first floor"},
  {ch:"Ch10 퇴원",ko:"퇴원 요약지는 오늘 드리겠습니다.",en:"The discharge summary will be given to you today"},
  {ch:"Ch10 퇴원",ko:"퇴원 전에 궁금한 점이 있으신가요?",en:"Do you have any questions before you go home"},
  {ch:"Appendix",ko:"즉시 의사를 호출하겠습니다.",en:"I will call the doctor right away"},
  {ch:"Appendix",ko:"제가 여기 있겠습니다. 혼자가 아니에요.",en:"I am right here with you you are not alone"},
  {ch:"Appendix",ko:"걱정하지 마세요. 저희가 돕겠습니다.",en:"Please do not worry we are here to help you"},
  {ch:"Appendix",ko:"잘 하고 계세요. 조금만 더요.",en:"You are doing great just a little longer"},
  {ch:"Appendix",ko:"진행 전에 동의가 필요합니다.",en:"I need your consent before we proceed"},
  {ch:"Appendix",ko:"의사가 이 약을 처방했습니다.",en:"The doctor has ordered this medication for you"},
  {ch:"Appendix",ko:"시작 전 궁금한 점 있으신가요?",en:"Do you have any questions before we start"},
  {ch:"Appendix",ko:"언제든지 편하게 질문하세요.",en:"Please feel free to ask me anything at any time"},
  {ch:"Appendix",ko:"설명드린 내용 모두 이해하셨나요?",en:"Did you understand everything I explained"},
  {ch:"Appendix",ko:"갑작스러운 심한 흉통이 있으면 즉시 응급실에 가세요.",en:"If you have sudden severe chest pain please go to the emergency room immediately"},
  {ch:"Appendix",ko:"어떤 기분인지 이해합니다. 정말 힘드시겠어요.",en:"I understand how you feel it must be very difficult"},
  {ch:"Appendix",ko:"새로운 흉통이나 호흡 곤란이 있으면 즉시 말씀해 주세요.",en:"Please report any new chest pain or shortness of breath immediately"}
];

var CLIST=[];
(function(){var s={};for(var i=0;i<QS.length;i++){if(!s[QS[i].ch]){s[QS[i].ch]=true;CLIST.push(QS[i].ch);}}})();
var selCh={};CLIST.forEach(function(c){selCh[c]=true;});
var qs=[],cur=0,score=0,okCnt=0,ngCnt=0,streak=0,answered=false,userAns=[],swWords=[];

function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function show(id){document.getElementById(id).style.display='block';}
function hide(id){document.getElementById(id).style.display='none';}

function renderFilters(){
  var row=document.getElementById('filter-row');row.innerHTML='';
  var allOn=CLIST.every(function(c){return selCh[c];});
  var ac=document.createElement('span');ac.className='fchip'+(allOn?' on':'');ac.textContent='전체';
  ac.onclick=function(){var on=CLIST.every(function(c){return selCh[c];});CLIST.forEach(function(c){selCh[c]=!on;});renderFilters();updateNote();};
  row.appendChild(ac);
  CLIST.forEach(function(ch){
    var chip=document.createElement('span');chip.className='fchip'+(selCh[ch]?' on':'');chip.textContent=ch;
    chip.onclick=(function(c){return function(){selCh[c]=!selCh[c];renderFilters();updateNote();};})(ch);
    row.appendChild(chip);
  });
}
function updateNote(){
  var n=QS.filter(function(q){return selCh[q.ch];}).length;
  document.getElementById('count-note').innerHTML='선택된 문제 수: <strong>'+n+'개</strong> — 랜덤 10문제 출제';
}
function goStart(){hide('quiz');hide('finish');show('start');renderFilters();updateNote();}
function startQuiz(){
  var pool=QS.filter(function(q){return selCh[q.ch];});
  if(!pool.length){alert('챕터를 하나 이상 선택해 주세요.');return;}
  qs=shuffle(pool).slice(0,10);cur=0;score=0;okCnt=0;ngCnt=0;streak=0;
  hide('start');hide('finish');show('quiz');loadQ();
}
function loadQ(){
  answered=false;userAns=[];
  var q=qs[cur];
  document.getElementById('qnum').textContent=cur+1;
  document.getElementById('qtotal').textContent=qs.length;
  document.getElementById('badge').textContent=q.ch;
  document.getElementById('qtext').textContent=q.ko;
  document.getElementById('s-score').textContent=score;
  document.getElementById('s-ok').textContent=okCnt;
  document.getElementById('s-ng').textContent=ngCnt;
  document.getElementById('prog').style.width=Math.round(cur/qs.length*100)+'%';
  var sb=document.getElementById('streak');
  if(streak>=2){sb.style.display='';sb.textContent='🔥 '+streak+' 연속 정답';}else{sb.style.display='none';}
  swWords=shuffle(q.en.split(' '));
  renderAZ();renderWB();
  var fb=document.getElementById('fb');fb.className='feedback';fb.innerHTML='';
  document.getElementById('btn-check').style.display='';
  document.getElementById('btn-next').style.display='none';
  document.getElementById('az').className='answer-zone';
}
function renderAZ(){
  var az=document.getElementById('az');az.innerHTML='';
  if(!userAns.length){az.innerHTML='<span class="az-hint">아래 단어를 순서대로 클릭하세요</span>';return;}
  userAns.forEach(function(w,i){
    var c=document.createElement('span');c.className='achip';c.textContent=w;
    (function(idx){c.onclick=function(){if(!answered)removeW(idx);};})(i);
    az.appendChild(c);
  });
}
function renderWB(){
  var wb=document.getElementById('wb');wb.innerHTML='';
  swWords.forEach(function(w,i){
    var c=document.createElement('span');c.className='wchip';c.id='wc'+i;c.textContent=w;
    (function(word,idx){c.onclick=function(){addW(word,idx);};})(w,i);
    wb.appendChild(c);
  });
}
function addW(w,idx){
  if(answered)return;userAns.push(w);
  var el=document.getElementById('wc'+idx);if(el)el.className='wchip used';
  renderAZ();
}
function removeW(idx){
  var w=userAns[idx];userAns.splice(idx,1);
  var chips=document.querySelectorAll('.wchip');
  for(var i=0;i<chips.length;i++){if(chips[i].textContent===w&&chips[i].className==='wchip used'){chips[i].className='wchip';break;}}
  renderAZ();
}
function resetAns(){
  if(answered)return;userAns=[];
  document.querySelectorAll('.wchip').forEach(function(c){c.className='wchip';});
  renderAZ();
}
function checkAns(){
  if(answered||!userAns.length)return;answered=true;
  var q=qs[cur];
  var correct=q.en.toLowerCase().split(' ');
  var user=userAns.map(function(w){return w.toLowerCase();});
  var ok=(JSON.stringify(correct)===JSON.stringify(user));
  var az=document.getElementById('az');var fb=document.getElementById('fb');
  if(ok){score+=10;okCnt++;streak++;az.className='answer-zone correct';fb.className='feedback ok';fb.innerHTML='&#10003; 정답입니다!<div class="answer-txt">'+q.en+'</div>';}
  else{ngCnt++;streak=0;az.className='answer-zone wrong';fb.className='feedback ng';fb.innerHTML='&#10007; 아쉽네요!<div class="answer-txt">정답: '+q.en+'</div>';}
  document.getElementById('s-score').textContent=score;
  document.getElementById('s-ok').textContent=okCnt;
  document.getElementById('s-ng').textContent=ngCnt;
  var sb=document.getElementById('streak');
  if(streak>=2){sb.style.display='';sb.textContent='🔥 '+streak+' 연속 정답';}else{sb.style.display='none';}
  document.getElementById('btn-check').style.display='none';
  document.getElementById('btn-next').style.display='';
}
function nextQ(){cur++;if(cur>=qs.length){showFinish();return;}loadQ();}
function showFinish(){
  hide('quiz');show('finish');
  var pct=Math.round(okCnt/qs.length*100);
  document.getElementById('f-score').textContent=okCnt+' / '+qs.length;
  document.getElementById('f-ok').textContent=okCnt;
  document.getElementById('f-ng').textContent=ngCnt;
  var icon,msg;
  if(pct===100){icon='🏆';msg='완벽해요! 어떤 환자가 와도 자신 있게 말할 수 있어요!';}
  else if(pct>=80){icon='⭐';msg='훌륭해요! 조금만 더 연습하면 완벽해질 거예요.';}
  else if(pct>=60){icon='👍';msg='잘 하셨어요. 틀린 문장을 책자에서 복습해 보세요.';}
  else if(pct>=40){icon='📖';msg='더 연습이 필요해요. 해당 챕터를 다시 공부해 보세요!';}
  else{icon='💪';msg='괜찮아요! 반복 학습이 최고예요. 다시 도전해 봐요!';}
  document.getElementById('f-icon').textContent=icon;
  document.getElementById('f-msg').textContent=msg;
}

goStart();
</script>
</body>
</html>
